spring.application.name=leave-tracker

# H2 runs inside the application's own memory. Nothing is written to disk, so every
# restart gives a clean database that DataSeeder immediately refills.
spring.datasource.url=jdbc:h2:mem:leavedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Return errors as RFC 9457 problem details, which carries the reason from every
# ResponseStatusException in a "detail" field. Without this the frontend could only show
# a bare 400 instead of "endDate cannot be before startDate".
spring.mvc.problemdetails.enabled=true

# Hibernate builds the tables from the @Entity classes at startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the tables at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:leavedb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Shared secret that signs and verifies JWTs (HMAC-SHA256, so it must be at least
# 32 characters). Override with the JWT_SECRET environment variable outside of development.
app.jwt.secret=${JWT_SECRET:dev-only-leave-tracker-hmac-signing-secret-change-me}
